<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - SHELTER</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen" class="active">
    <div class="login-box">
      <h2>SHELTER ADMIN</h2>
      <p>Iniciá sesión para gestionar el menú</p>
      <form id="login-form">
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <p id="login-error" class="error"></p>
        <button type="submit">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashboard">
    <header class="admin-header">
      <div class="header-left">
        <h1>SHELTER <span>Panel de Control</span></h1>
      </div>
      <div class="header-right">
        <button id="btn-logout" class="btn-outline">Cerrar Sesión</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="controls-bar">
        <div class="filters">
          <select id="category-filter">
            <option value="todos">Todas las categorías</option>
            <option value="entradas">Entradas</option>
            <option value="burgas">Hamburguesas</option>
            <option value="combos">Combos</option>
            <option value="papas">Papas</option>
            <option value="pizzas">Pizzas</option>
            <option value="cervezas">Cervezas</option>
            <option value="tragos">Tragos</option>
          </select>
        </div>
        <button id="btn-add-product" class="btn-primary">+ Agregar Producto</button>
      </div>

      <div class="table-container">
        <table id="products-table">
          <thead>
            <tr>
              <th>Estado</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="products-tbody">
            <!-- Los productos se cargan acá dinámicamente -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- MODAL DE PRODUCTO (Agregar / Editar) -->
  <div id="product-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Editar Producto</h2>
      <form id="product-form">
        <input type="hidden" id="prod-id">
        
        <div class="form-group">
          <label>Nombre del producto</label>
          <input type="text" id="prod-name" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Categoría</label>
            <select id="prod-category" required>
              <option value="entradas">Entradas</option>
              <option value="burgas">Hamburguesas</option>
              <option value="combos">Combos (Upsell)</option>
              <option value="papas">Papas</option>
              <option value="pizzas">Pizzas</option>
              <option value="cervezas">Cervezas</option>
              <option value="tragos">Tragos</option>
            </select>
          </div>
          <div class="form-group">
            <label>Precio ($)</label>
            <input type="number" id="prod-price" required>
          </div>
        </div>

        <div class="form-group">
          <label>Descripción (Opcional)</label>
          <textarea id="prod-desc" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label>Ruta de la Imagen (Opcional - ej: img/burger.jpg)</label>
          <input type="text" id="prod-img">
        </div>

        <div class="form-row checkbox-row">
          <label class="switch-label">
            <input type="checkbox" id="prod-active">
            <span>Mostrar en el Menú (Activo)</span>
          </label>
        </div>
        
        <div class="form-row checkbox-row" id="star-row">
          <label class="switch-label">
            <input type="checkbox" id="prod-star">
            <span>Es la "Estrella" (Borde brillante especial)</span>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel" class="btn-outline">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
